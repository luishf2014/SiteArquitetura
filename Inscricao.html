<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição - Curso de Programação</title>
    <link rel="stylesheet" href="InscricaoStyle.css">
    <script>
        function armazenarInscricao(event) {
            event.preventDefault(); // Impede o envio padrão do formulário

            const nome = document.getElementById("nome");
            const email = document.getElementById("email");
            const curso = document.getElementById("curso");

            const inscricoes = JSON.parse(localStorage.getItem("inscricoes")) || [];
            inscricoes.push({ nome, email, cpf, curso });

            localStorage.setItem("inscricoes", JSON.stringify(inscricoes));
            alert("Inscrição realizada com sucesso!");

            // Redireciona para a área do usuário
            window.location.href = "AreaAluno.html";
        }
    </script>
</head>

<body>
    <header>
        <h1>Inscrição no Curso</h1>
    </header>

    <main>
        <h2>Preencha seus dados</h2>
        <form id="inscricao-form" onsubmit="armazenarInscricao(event)">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome">

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email">

            <label for="curso">Selecione o Curso:</label>
            <select id="curso" name="curso">
                <option value="">Selecione...</option>
                <option value="javascript">JavaScript</option>
                <option value="python">Python</option>
                <option value="html-css">HTML e CSS</option>
            </select>

            <h3>Dados do Cartão de Crédito</h3>
            <label for="numero-cartao">Número do Cartão:</label>
            <input type="text" id="numero-cartao" name="numero-cartao">

            <label for="numero-cartao">CPF:</label>
            <input type="text" id="cpf" name="cpf" placeholder="Apenas Números" oninput="formatarCPF(this)"
                maxlength="14">
            <script>
                function formatarCPF(campo) {
                    campo.value = campo.value.replace(/\D/g, ''); // Remove tudo que não é dígito
                    campo.value = campo.value.replace(/(\d{3})(\d)/, '$1.$2'); // Coloca o ponto entre o terceiro e o quarto dígitos
                    campo.value = campo.value.replace(/(\d{3})(\d)/, '$1.$2'); // Coloca o ponto entre o terceiro e o quarto dígitos (de novo)
                    campo.value = campo.value.replace(/(\d{3})(\d{1,2})$/, '$1-$2'); // Coloca o hífen entre o terceiro e o quarto dígitos
                }
            </script>

            <label for="validade">Validade:</label>
            <input type="text" id="validade" name="validade" placeholder="MM/AA">

            <label for="cvv">CVV:</label>
            <input type="text" id="cvv" name="cvv">

            <button type="submit" class="btn"><a href="AreaAluno.html">Enviar Inscrição</a></button>
            <a href="index.html" class="btn voltar">Voltar</a>
        </form>
    </main>

    <footer>
        <p>&copy; 2024 Curso de Programação Online. Todos os direitos reservados.</p>
    </footer>
</body>

</html>
